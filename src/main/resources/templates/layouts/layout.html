<!DOCTYPE html>
<!--
  Reusable application shell. Views supply a single <section> via the layout
  fragment, while navigation, responsive behaviour, and vendor assets stay DRY.
-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#312e81">
<title>Training Center</title>
<link rel="stylesheet"
	th:href="@{/plugins/bootstrap/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/plugins/fontawesome/css/all.min.css}">
<link rel="stylesheet" th:href="@{/css/root.css}">
<link rel="stylesheet" th:href="@{/css/saas.css}">
<link rel="stylesheet" th:href="@{/css/loading.css}">
<style>
/* The SaaS design tokens shared by every view using this layout. */
:root {
	--app-primary: #4f46e5;
	--app-primary-hover: #4338ca;
	--app-canvas: #f8fafc;
	--app-ink: #0f172a;
	--app-muted: #64748b;
	--app-border: #e2e8f0;
}

body {
	background: var(--app-canvas);
	color: var(--app-ink);
}

.sidebar-bg {
	background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%);
	box-shadow: 8px 0 30px rgba(15, 23, 42, .08);
}

.dashboard-container {
	background: var(--app-canvas);
	padding: 24px 32px;
}

.top-bar {
	background: rgba(255, 255, 255, .82);
	border: 1px solid rgba(234, 236, 240, .9);
	border-radius: 16px;
	box-shadow: 0 2px 10px rgba(16, 24, 40, .03);
	margin-bottom: 28px;
	padding: 10px 14px 10px 18px;
}

.top-bar .search-box {
	background: #f9fafb;
	border: 1px solid var(--app-border);
	border-radius: 10px;
	color: var(--app-ink);
	width: min(320px, 55vw);
}

.top-bar .search-box:focus {
	border-color: #818cf8;
	box-shadow: 0 0 0 .22rem rgba(99, 102, 241, .12);
}

.mobile-menu-trigger {
	background: #eef2ff;
	border: 0;
	border-radius: 10px;
	color: var(--app-primary);
	display: none;
	height: 38px;
	width: 38px;
}

.app-user-dot {
	align-items: center;
	background: #e0e7ff;
	border-radius: 50%;
	color: var(--app-primary);
	display: flex;
	font-size: .8rem;
	font-weight: 800;
	height: 34px;
	justify-content: center;
	width: 34px;
}

.app-footer {
	color: #98a2b3;
	font-size: .78rem;
	padding: 24px 4px 0;
}
/* Compatibility layer: modernizes the existing module components without duplicating markup. */
.russett-card {
	background: #fff;
	border: 1px solid var(--app-border);
	border-radius: 16px;
	box-shadow: 0 2px 10px rgba(16, 24, 40, .04);
	padding: 1.25rem;
}

.russett-card:hover {
	box-shadow: 0 8px 22px rgba(16, 24, 40, .07);
	transition: box-shadow .2s ease;
}

.form-control, .form-select, .russett-input {
	border: 1px solid #d0d5dd !important;
	border-radius: 10px !important;
	box-shadow: none !important;
	min-height: 42px;
}

.form-control:focus, .form-select:focus, .russett-input:focus {
	border-color: #818cf8 !important;
	box-shadow: 0 0 0 .22rem rgba(99, 102, 241, .13) !important;
	transform: none !important;
}

.form-floating>label {
	color: #667085;
}

.form-label {
	color: #344054;
	font-size: .86rem;
}

.btn-juniper {
	background: var(--app-primary);
	border-radius: 10px;
	margin: 0;
	padding: .65rem 1rem;
	width: auto;
}

.btn-juniper:hover {
	background: var(--app-primary-hover);
}

.btn-clear {
	background: #fff;
	border: 1px solid #d0d5dd;
	border-radius: 10px;
	color: #344054;
	margin: 0;
	padding: .65rem 1rem;
	width: auto;
}

.btn-clear:hover {
	background: #f9fafb;
	color: #182230;
}

.russett-table {
	overflow: hidden;
}

.russett-table thead th {
	background: #f9fafb;
	color: #667085;
}

.russett-table tbody tr {
	transition: background .15s ease;
}

.russett-table tbody tr:hover {
	background: #f5f7ff !important;
}

.badge, .status-badge {
	border-radius: 999px;
	font-weight: 700;
	padding: .4em .7em;
}

@media ( max-width :1199.98px) {
	.dashboard-container {
		padding: 16px;
	}
	.mobile-menu-trigger {
		display: inline-flex;
		align-items: center;
		justify-content: center;
	}
	.top-bar {
		margin-bottom: 20px;
	}
	.top-bar .search-box {
		width: 100%;
	}
}

@media ( max-width :575.98px) {
	.top-bar {
		gap: 10px;
	}
	.top-bar>div:first-child {
		flex: 1;
	}
	.top-bar .search-box {
		min-width: 0;
	}
}
</style>
</head>
<body>
	<div class="app-loading-overlay" id="appLoadingOverlay" role="status" aria-live="polite" aria-label="Loading" aria-hidden="true">
		<div class="app-loading-spinner"><img th:src="@{/images/logo.png}" alt="Kye Sin Training Center"></div>
		<span class="app-loading-label">Loading...</span>
	</div>
	<div class="d-flex">
		<div th:replace="~{layouts/fragments/side-nav :: sidebar}"></div>
		<div class="dashboard-container flex-grow-1">
			
			<main th:replace="${content}"></main>
			<footer class="app-footer d-flex justify-content-between">
				<span>© 2026 Training Center</span><span>Management portal</span>
			</footer>
		</div>
	</div>
	<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/js/menu.js}"></script>
	<script th:src="@{/js/loading.js}"></script>
	<!-- Flash messages remain non-blocking, consistent toasts across every view. -->
	<div class="toast-container position-fixed bottom-0 end-0 p-3">
		<div th:if="${success != null}"
			class="toast app-toast text-bg-success border-0" role="alert"
			data-bs-delay="5000">
			<div class="d-flex">
				<div class="toast-body">
					<i class="fa-solid fa-circle-check me-2"></i><span
						th:text="${success}">Saved successfully.</span>
				</div>
				<button type="button" class="btn-close btn-close-white me-2 m-auto"
					data-bs-dismiss="toast"></button>
			</div>
		</div>
		<div th:if="${error != null}"
			class="toast app-toast text-bg-danger border-0" role="alert"
			data-bs-delay="6500">
			<div class="d-flex">
				<div class="toast-body">
					<i class="fa-solid fa-circle-exclamation me-2"></i><span
						th:text="${error}">Something went wrong.</span>
				</div>
				<button type="button" class="btn-close btn-close-white me-2 m-auto"
					data-bs-dismiss="toast"></button>
			</div>
		</div>
	</div>
	<script>document.querySelectorAll('.toast').forEach(element => bootstrap.Toast.getOrCreateInstance(element).show());</script>
</body>
</html>
