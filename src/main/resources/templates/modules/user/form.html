<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layouts/layout :: layout(~{::section})}">
<body>
	<section>
		<div class="app-page-header">
			<div>
				<nav class="app-breadcrumb" aria-label="Breadcrumb">
					<a th:href="@{/dashboard}">Dashboard</a><span class="mx-2">/</span><a
						th:href="@{/users}">Users</a><span class="mx-2">/</span><span
						th:text="${user.id == null ? 'Add user' : 'Edit user'}">Add
						user</span>
				</nav>
				<h1 class="app-page-title"
					th:text="${user.id == null ? 'Add user' : 'Edit user'}">Add
					user</h1>
				<p class="app-page-subtitle">Create a staff account and assign
					its access role.</p>
			</div>
			<div class="app-actions">
				<a th:href="@{/users}" class="btn btn-app-secondary"><i
					class="fa-solid fa-arrow-left me-2"></i>Back to users</a>
			</div>
		</div>
		<div class="row justify-content-center">
			<div class="col-12 col-xl-9">
				<div class="app-card">
					<form th:action="@{/users/save}" th:object="${user}" method="post">
						<input type="hidden" th:field="*{id}">
						<div class="d-flex align-items-center gap-2 mb-4">
							<span class="app-avatar"><i class="fa-solid fa-user-gear"></i></span>
							<div>
								<h2 class="h6 mb-1">Account details</h2>
								<p class="small text-muted mb-0">Set identity, access role,
									and account state.</p>
							</div>
						</div>
						<div class="row g-3">
							<div class="col-12 col-md-6">
								<label for="name" class="form-label">Full name *</label><input
									id="name" type="text" th:field="*{name}" class="form-control"
									placeholder="Enter full name" required>
							</div>
							<div class="col-12 col-md-6">
								<label for="username" class="form-label">Username *</label><input
									id="username" type="text" th:field="*{username}"
									class="form-control" placeholder="Enter a username"
									th:readonly="${user.id != null}" required>
								<div class="form-text" th:if="${user.id != null}">Username
									cannot be changed after account creation.</div>
							</div>
							<div class="col-12 col-md-6">
								<label for="email" class="form-label">Email address</label><input
									id="email" type="email" th:field="*{email}"
									class="form-control" placeholder="name@example.com">
							</div>
							<div class="col-12 col-md-6">
								<label for="phoneNumber" class="form-label">Phone number</label><input
									id="phoneNumber" type="tel" th:field="*{phoneNumber}"
									class="form-control" placeholder="Enter phone number">
							</div>
							<div class="col-12 col-md-6">
								<label for="roleId" class="form-label">Access role *</label><select
									id="roleId" th:field="*{roleId}" class="form-select" required><option
										value="">Select role</option>
									<option th:each="role : ${roles}" th:value="${role.id}"
										th:text="${role.name}">Role</option></select>
							</div>
							<div class="col-12 col-md-6">
								<label for="status" class="form-label">Account status</label><select
									id="status" th:field="*{status}" class="form-select"><option
										th:if="${user.id == null}" value="">Select status</option>
									<option th:each="status : ${statuses}" th:value="${status}"
										th:text="${status.label}">Active</option></select>
							</div>
							<div class="col-12" th:if="${user.id == null}">
								<label for="password" class="form-label">Password *</label>
								<div class="position-relative">
									<i
										class="fa-solid fa-lock position-absolute top-50 translate-middle-y ms-3 text-muted"></i><input
										id="password" type="password" th:field="*{password}"
										class="form-control ps-5"
										placeholder="Create a secure password"
										autocomplete="new-password" required>
								</div>
							</div>
						</div>
						<div
							class="d-flex flex-column-reverse flex-sm-row justify-content-end gap-2 mt-4 pt-3 border-top">
							<a th:href="@{/users}" class="btn btn-app-secondary">Cancel</a>
							<button type="submit" class="btn btn-app-primary">
								<i class="fa-solid fa-floppy-disk me-2"></i><span
									th:text="${user.id == null ? 'Create user' : 'Save changes'}">Create
									user</span>
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
