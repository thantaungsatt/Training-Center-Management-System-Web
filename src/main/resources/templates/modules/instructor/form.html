<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layouts/layout :: layout(~{::section})}">
<body>
	<section>
		<div class="app-page-header">
			<div>
				<nav class="app-breadcrumb" aria-label="Breadcrumb">
					<a th:href="@{/dashboard}">Dashboard</a><span class="mx-2">/</span><a
						th:href="@{/instructors}">Instructors</a><span class="mx-2">/</span><span
						th:text="${instructor.id == null ? 'Add instructor' : 'Edit instructor'}">Add
						instructor</span>
				</nav>
				<h1 class="app-page-title"
					th:text="${instructor.id == null ? 'Add instructor' : 'Edit instructor'}">Add
					instructor</h1>
				<p class="app-page-subtitle">Create a trainer profile for course
					and class assignments.</p>
			</div>
			<div class="app-actions">
				<a th:href="@{/instructors}" class="btn btn-app-secondary"><i
					class="fa-solid fa-arrow-left me-2"></i>Back to instructors</a>
			</div>
		</div>
		<div class="row justify-content-center">
			<div class="col-12 col-xl-9">
				<div class="app-card">
					<form th:action="@{/instructors/save}" th:object="${instructor}"
						method="post">
						<input type="hidden" th:field="*{id}">
						<div class="d-flex align-items-center gap-2 mb-4">
							<span class="app-avatar"><i
								class="fa-solid fa-chalkboard-user"></i></span>
							<div>
								<h2 class="h6 mb-1">Instructor profile</h2>
								<p class="small text-muted mb-0">Keep the instructor contact
									information current.</p>
							</div>
						</div>
						<div class="row g-3">
							<div class="col-12 col-md-6">
								<label for="name" class="form-label">Full name *</label><input
									id="name" type="text" th:field="*{name}" class="form-control"
									placeholder="Enter full name" required>
							</div>
							<div class="col-12 col-md-6">
								<label for="phoneNumber" class="form-label">Phone number</label><input
									id="phoneNumber" type="tel" th:field="*{phoneNumber}"
									class="form-control" placeholder="Enter phone number">
							</div>
							<div class="col-12 col-md-6">
								<label for="email" class="form-label">Email address</label><input
									id="email" type="email" th:field="*{email}"
									class="form-control" placeholder="name@example.com">
							</div>
							<div class="col-12 col-md-6">
								<label for="status" class="form-label">Status</label><select
									id="status" th:field="*{status}" class="form-select"><option
										th:if="${instructor.id == null}" value="">Select
										status</option>
									<option th:each="status : ${statuses}" th:value="${status}"
										th:text="${status.label}">Active</option></select>
							</div>
							<div class="col-12">
								<label for="address" class="form-label">Address *</label>
								<textarea id="address" th:field="*{address}"
									class="form-control" placeholder="Enter address" rows="3"
									required></textarea>
							</div>
						</div>
						<div
							class="d-flex flex-column-reverse flex-sm-row justify-content-end gap-2 mt-4 pt-3 border-top">
							<a th:href="@{/instructors}" class="btn btn-app-secondary">Cancel</a>
							<button type="submit" class="btn btn-app-primary">
								<i class="fa-solid fa-floppy-disk me-2"></i><span
									th:text="${instructor.id == null ? 'Save instructor' : 'Save changes'}">Save
									instructor</span>
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
