# ===============================
# SERVER CONFIG
# ===============================
spring.application.name=training-center-system
server.port=8080

# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/training_center?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=validate

# ===============================
# THYMELEAF CONFIG
# ===============================
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN

logging.file.name=D:/server/training_center/logs/tcs/admin/admin.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

spring.messages.basename=messages
spring.messages.encoding=UTF-8